<svg width="100%" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Terminal demo of Ghost-line</title>
<desc>Animated terminal showing example usage of the Ghost-line CLI tool with sample data</desc>

<rect width="900" height="560" rx="12" fill="#0b0b0b"/>
<rect x="0.5" y="0.5" width="899" height="559" rx="12" fill="none" stroke="#1e1e1e" stroke-width="1"/>

<rect width="900" height="36" rx="12" fill="#111111"/>
<rect y="24" width="900" height="12" fill="#111111"/>
<circle cx="22" cy="18" r="6" fill="#3a2020"/>
<circle cx="42" cy="18" r="6" fill="#3a3520"/>
<circle cx="62" cy="18" r="6" fill="#203a20"/>
<text x="450" y="23" text-anchor="middle" font-family="monospace" font-size="11" fill="#666666" letter-spacing="1">demo@ghost-line:~</text>
<line x1="20" y1="48" x2="880" y2="48" stroke="#1a1a1a" stroke-width="0.5"/>

<text font-family="monospace" font-size="13" fill="#8ab4f8" opacity="0">
  <tspan x="20" y="74">$ python3 cli.py --name alex morgan --known-handle alexmorgan_dev \</tspan>
  <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="13" fill="#8ab4f8" opacity="0">
  <tspan x="20" y="94">    --location toronto --year 1996 --output demo_report</tspan>
  <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.1s" fill="freeze"/>
</text>

<text font-family="monospace" font-size="12.5" fill="#7a7a7a" opacity="0">
  <tspan x="20" y="122">[*] 143 candidate username(s) to check</tspan>
  <animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#7a7a7a" opacity="0">
  <tspan x="20" y="142">[*] Loading WMN dataset...</tspan>
  <animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#7a7a7a" opacity="0">
  <tspan x="20" y="162">[*] 712 sites loaded</tspan>
  <animate attributeName="opacity" values="0;1" begin="2.1s" dur="0.1s" fill="freeze"/>
</text>

<line x1="20" y1="176" x2="880" y2="176" stroke="#1a1a1a" stroke-width="0.5" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.1s" fill="freeze"/>
</line>

<text font-family="monospace" font-size="12.5" fill="#5f9e6e" opacity="0">
  <tspan x="20" y="198">[1/143]  alexmorgan_dev                 -&gt; 3 hit(s)  (0.8s)</tspan>
  <animate attributeName="opacity" values="0;1" begin="2.8s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#7a7a7a" opacity="0">
  <tspan x="20" y="216">[2/143]  alexmorgan                     -&gt; 1 hit(s)  (0.6s)</tspan>
  <animate attributeName="opacity" values="0;1" begin="3.1s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#7a7a7a" opacity="0">
  <tspan x="20" y="234">[3/143]  morganalex                     -&gt; 0 hit(s)  (0.5s)</tspan>
  <animate attributeName="opacity" values="0;1" begin="3.4s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#5f9e6e" opacity="0">
  <tspan x="20" y="252">[4/143]  alex.morgan                    -&gt; 2 hit(s)  (0.7s)</tspan>
  <animate attributeName="opacity" values="0;1" begin="3.7s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#7a7a7a" opacity="0">
  <tspan x="20" y="270">[5/143]  alextoronto                    -&gt; 0 hit(s)  (0.4s)</tspan>
  <animate attributeName="opacity" values="0;1" begin="4.0s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#666666" opacity="0">
  <tspan x="20" y="288">  ...  138 more candidates checked  ...</tspan>
  <animate attributeName="opacity" values="0;1" begin="4.4s" dur="0.1s" fill="freeze"/>
</text>

<line x1="20" y1="302" x2="880" y2="302" stroke="#1a1a1a" stroke-width="0.5" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="4.8s" dur="0.1s" fill="freeze"/>
</line>

<text font-family="monospace" font-size="12.5" fill="#c9c9c9" opacity="0">
  <tspan x="20" y="324">[*] Done. 9 total hit(s) across 143 username(s).</tspan>
  <animate attributeName="opacity" values="0;1" begin="5.2s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#8a7a4a" opacity="0">
  <tspan x="20" y="344">[*] 6 site check(s) did not respond — see report for details</tspan>
  <animate attributeName="opacity" values="0;1" begin="5.5s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#7a7a7a" opacity="0">
  <tspan x="20" y="364">[*] Reports written: demo_report.json / .md / .csv</tspan>
  <animate attributeName="opacity" values="0;1" begin="5.8s" dur="0.1s" fill="freeze"/>
</text>

<line x1="20" y1="380" x2="880" y2="380" stroke="#1a1a1a" stroke-width="0.5" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="6.1s" dur="0.1s" fill="freeze"/>
</line>

<rect x="20" y="396" width="860" height="140" rx="6" fill="#111111" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="6.4s" dur="0.15s" fill="freeze"/>
</rect>
<text font-family="monospace" font-size="12" fill="#999999" opacity="0">
  <tspan x="36" y="418">demo_report.md</tspan>
  <animate attributeName="opacity" values="0;1" begin="6.6s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12.5" fill="#dddddd" opacity="0">
  <tspan x="36" y="444">alexmorgan_dev — 3 hit(s), 0 unresolved</tspan>
  <animate attributeName="opacity" values="0;1" begin="6.9s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12" fill="#7a9ecb" opacity="0">
  <tspan x="36" y="464">- GitHub — github.com/alexmorgan_dev</tspan>
  <animate attributeName="opacity" values="0;1" begin="7.2s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12" fill="#7a9ecb" opacity="0">
  <tspan x="36" y="482">- DeviantArt — deviantart.com/alexmorgan_dev</tspan>
  <animate attributeName="opacity" values="0;1" begin="7.4s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="12" fill="#7a9ecb" opacity="0">
  <tspan x="36" y="500">- Keybase — keybase.io/alexmorgan_dev</tspan>
  <animate attributeName="opacity" values="0;1" begin="7.6s" dur="0.1s" fill="freeze"/>
</text>
<text font-family="monospace" font-size="11.5" fill="#666666" opacity="0">
  <tspan x="36" y="522">Hits are candidates only — verify manually before drawing conclusions.</tspan>
  <animate attributeName="opacity" values="0;1" begin="7.9s" dur="0.1s" fill="freeze"/>
</text>

<text font-family="monospace" font-size="13" fill="#8ab4f8" opacity="0">
  <tspan x="20" y="552">$ </tspan>
  <animate attributeName="opacity" values="0;1" begin="8.3s" dur="0.1s" fill="freeze"/>
</text>
<rect x="34" y="539" width="8" height="14" fill="#8ab4f8" opacity="0">
  <animate attributeName="opacity" values="0;1" begin="8.3s" dur="0.1s" fill="freeze"/>
  <animate attributeName="opacity" values="1;0;1;0;1;0;1" begin="8.4s" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>